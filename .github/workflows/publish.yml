name: Deploy to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: gh-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Process
        env:
          A1B5DA: ${{ secrets.A1B5DA }}
          B57593: ${{ secrets.B57593 }}
        run: |
          python3 -c "
          import pathlib, os, sys
          sec_a = os.environ.get('A1B5DA', '')
          sec_b = os.environ.get('B57593', '')
          target = pathlib.Path('index.html')
          before = target.read_text(encoding='utf-8')
          after = before
          if sec_a:
              after = after.replace('<!-- e991fb96ccd24524e17ae43ba728a5ea2797 -->', sec_a)
          if sec_b:
              after = after.replace('<!-- 4ea28814155f7ffc3b1b23cf7025a790 -->', sec_b)
          if after == before and (sec_a or sec_b):
              sys.exit(1)
          if after != before:
              target.write_text(after, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
